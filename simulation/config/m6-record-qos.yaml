# Late recorders must request retained data from these one-shot publishers.
/map:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 1
/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 10
/robot_description:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 1
