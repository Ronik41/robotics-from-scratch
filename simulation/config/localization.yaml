amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    # Differential odometry's rotation centre, 0.14 m ahead of base_link.
    base_frame_id: base_drive
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 0.3
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 8.0
    max_beams: 180
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    sigma_hit: 0.1
    z_hit: 0.95
    z_rand: 0.05
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: -1.0
